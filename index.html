<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Landing Page</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .container {
    text-align: center;
    padding: 40px 20px;
    max-width: 600px;
  }
  h1 {
    font-size: 2.8rem;
    margin-bottom: 16px;
    animation: fadeInDown 0.8s ease;
  }
  p {
    font-size: 1.2rem;
    margin-bottom: 32px;
    opacity: 0.9;
    animation: fadeInUp 0.8s ease 0.2s;
  }
  .btn {
    display: inline-block;
    padding: 14px 36px;
    background: #fff;
    color: #764ba2;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  @keyframes fadeInDown {
    from { opacity:0; transform: translateY(-20px); }
    to { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity:0; transform: translateY(20px); }
    to { opacity:1; transform: translateY(0); }
  }
  .status {
    margin-top: 30px;
    font-size: 0.9rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="container">
    <span class="badge">🚀 TEST ORTAMI</span>
    <h1>Merhaba Dünya!</h1>
    <p>Bu basit bir test landing page'idir. Deploy sisteminizi kontrol etmek için hazırlandı.</p>
    <a href="#" class="btn" id="testBtn">Beni Tıkla</a>
    <div class="status" id="statusText">Henüz tıklanmadı</div>
  </div>
  <script>
    let clickCount = 0;
    document.getElementById('testBtn').addEventListener('click', function(e){
      e.preventDefault();
      clickCount++;
      document.getElementById('statusText').textContent = 'Tıklama sayısı: ' + clickCount + ' ✅';
    });
  </script>
</body>
</html>
